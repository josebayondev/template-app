[project]
name = "myapp-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "pydantic-settings>=2.15",
    "psycopg[binary]>=3.3",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "sentry-sdk>=2.68.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "mypy>=2.3",
    "httpx>=0.28",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers turns a mistyped marker into an error instead of a warning nobody
# reads, which is exactly the failure mode that makes a marker useless.
addopts = "-ra --strict-markers --strict-config"
markers = [
    "db: needs a reachable PostgreSQL (docker compose up -d postgres)",
]
