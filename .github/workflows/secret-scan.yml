name: Secret scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks walks git history, not just the working tree, so it needs
          # every commit. The default shallow clone would only ever see the tip.
          fetch-depth: 0
          persist-credentials: false

      # The gitleaks CLI is MIT and runs anywhere. The official gitleaks-action
      # is deliberately not used: it requires a paid licence key for repositories
      # owned by a GitHub organisation, which would quietly break CI for any app
      # derived from this template that does not live under a personal account.
      #
      # Pinned by digest like the base images in backend/Dockerfile. Note that
      # Dependabot does not track image digests inside workflow run steps, so
      # this one has to be bumped by hand when a new gitleaks ships.
      - name: Scan git history for secrets
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/repo" \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --no-banner --redact --verbose
