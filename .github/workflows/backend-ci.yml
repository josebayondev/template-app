name: Backend CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect backend changes
        id: filter
        run: |
          # This workflow file counts as a backend change on purpose: without it
          # a PR that only edits the CI skips every job, so a broken pipeline
          # ships unnoticed and only surfaces on the next PR touching backend/.
          if git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            | grep -qE '^backend/|^\.github/workflows/backend-ci\.yml'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  ruff:
    name: ruff
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run ruff
        run: uv run ruff check .

  mypy:
    name: mypy
    needs: ruff
    if: needs.ruff.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run mypy
        run: uv run mypy app

  # Guards the gap between models and migrations: without this, adding a model
  # or a column and forgetting to generate the migration passes CI, deploys to
  # Render, and only fails in production against a table that does not exist.
  migrations:
    name: migrations
    needs: mypy
    if: needs.mypy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/myapp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      # No --extra dev: alembic is a runtime dependency and this job has no use
      # for ruff, mypy or pytest.
      - name: Install dependencies
        run: uv sync --frozen

      # Replays every migration against an empty database, so a broken one is
      # caught here instead of when migrate-production.yml hits Neon.
      - name: Apply migrations from an empty database
        run: uv run alembic upgrade head

      # Compares Base.metadata against the schema the migrations just built.
      - name: Fail if models drifted from migrations
        run: uv run alembic check

  pytest:
    name: pytest
    needs: migrations
    if: needs.migrations.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/myapp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # Not redundant with the migrations job: jobs do not share service containers,
      # so that job's schema died with it and this one starts on an empty database.
      # The db-marked tests need the real tables, and building them from the migrations
      # rather than from Base.metadata.create_all() means the suite runs against the
      # schema production will actually have -- a migration that drifts from the models
      # fails here as well as in `alembic check`.
      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run pytest
        run: uv run pytest

  docker-build:
    name: docker-build
    needs: pytest
    if: needs.pytest.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t myapp-backend:ci .

  # Checks the locked dependencies against the PyPI advisory database. Dependabot
  # (.github/dependabot.yml) proposes upgrades weekly with a 7-day cooldown; this
  # job is what stops an advisory from being ignored while that cadence catches up.
  #
  # It runs last on purpose: a new CVE can be published against an untouched
  # lockfile, so this job can go red for reasons that have nothing to do with the
  # PR. Putting it after the rest means that never delays lint or test feedback.
  pip-audit:
    name: pip-audit
    needs: docker-build
    if: needs.docker-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      # --extra dev on purpose. The dev tools never reach the image, but they do
      # execute here in CI, so a compromised one still matters.
      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Audit dependencies
        run: uv run pip-audit --progress-spinner off
